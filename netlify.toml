[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Tailwind v4's @tailwindcss/oxide requires Node >= 20
  NODE_VERSION = "20"

# F07 Offline Mode: the service worker and manifest must revalidate on every
# request, or a stale worker pins old logic/citations past a deploy. Hashed
# assets under /assets are safe to cache forever.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    # Correct MIME type — Netlify serves .webmanifest as octet-stream otherwise,
    # which some browsers reject during PWA installability checks.
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers. CSP allows Vue/Tailwind's inline styles; img data: covers
# inlined icons. The only third-party origins are Google Analytics'
# (public/gtag-init.js): googletagmanager.com serves gtag.js, and hits go to
# google-analytics.com / analytics.google.com. The app itself makes no external
# API calls. Widen a directive only if another third-party origin is added.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; manifest-src 'self'; base-uri 'self'; form-action 'self'"
